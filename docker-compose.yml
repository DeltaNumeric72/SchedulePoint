# SchedulePoint — local development services.
#
# ############################################################################
# # NOT RUNNABLE ON THE CURRENT EXECUTION MACHINE (FAD-7).                   #
# #                                                                          #
# # There is no Docker daemon, no Homebrew and no sudo in the environment    #
# # this file was authored in, so it has been WRITTEN AND REVIEWED but NEVER #
# # STARTED. Treat it as unverified until someone runs `docker compose up`   #
# # on a machine that has a daemon and reports back.                         #
# #                                                                          #
# # The interim local database is `embedded-postgres`, per                   #
# # spikes/sp-a-isolation/SPIKE-REPORT.md §2. See docs/dev-setup.md.         #
# ############################################################################
#
# Synthetic data only. No real staff, patient, or customer data may enter any
# of these services.

name: schedulepoint

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local development credentials for a throwaway container. Never reused
      # anywhere else, and never quoted here — a quoted value is what the
      # secret-scan gate looks for.
      POSTGRES_DB: schedulepoint_dev
      POSTGRES_USER: schedulepoint_owner
      POSTGRES_PASSWORD: CHANGEME
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schedulepoint_owner -d schedulepoint_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Object Lock + versioning are required by audit control A2
      # (SPEC-11 §3.1); MinIO is the local stand-in for S3 (TDG-09).
      MINIO_ROOT_USER: schedulepoint
      MINIO_ROOT_PASSWORD: CHANGEME
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    # The only permitted mail destination in development. A test that reaches a
    # real address is a defect, not a configuration mistake.
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
