# Ingress placeholder configuration.
#
# SKELETON — never started in this environment. The real configuration lands
# with SPEC-03 (raw-ingress trust boundary) and must additionally set body-size
# bounds, request timeouts, and upload handling appropriate to the enclave.
#
# The one property that is already load-bearing and must survive every later
# edit: **the access log format carries no request body and no query string.**
# I-17 forbids a raw external payload from reaching a log line, and a default
# nginx log format would do exactly that for a GET with parameters.

log_format sp_minimal '$remote_addr $status $request_method $uri '
                      '$body_bytes_sent $request_time "$http_x_correlation_id"';

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout sp_minimal;
    error_log /dev/stderr warn;

    # Never announce the software version.
    server_tokens off;

    location /api/ {
        proxy_pass http://app:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;

        # WebSocket upgrade path (SPEC-02 picklist transport). Idle timeout is
        # long on purpose; the ALB in front must match (SPEC-10 §2).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
